<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion | ODIT Lab Academy</title><style>:root{font-family:Inter,system-ui;color:#eafff5;background:#061c17}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#115c45,#061c17 55%);min-height:100vh}main{max-width:500px;margin:8vh auto;padding:25px}.card{padding:30px;border:1px solid #ffffff33;border-radius:20px;background:#ffffff0a}label{display:block;margin:18px 0 7px}input{width:100%;padding:13px;background:#0d2c23;border:1px solid #ffffff55;color:white;border-radius:9px;font:inherit}button{margin-top:22px;padding:14px 20px;background:#42db94;color:#053322;border:0;border-radius:9px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}p{color:#b9d6c9;line-height:1.5}a{color:#6eebb0}#notice{white-space:pre-line}</style></head><body><main><a href="../">← ODIT</a><div class="card"><h1>Connexion Lab Academy</h1><p>Accédez à votre compte et suivez votre candidature.</p><form id="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button id="btn">Se connecter</button></form><p id="notice" role="status"></p><p><a href="inscription.html">Créer un compte</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>'use strict';const client=window.supabase?.createClient('https://rniaixhxbfiznhrnxvvn.supabase.co','sb_publishable_bS_yjMA0eCPk2SF5IQHTZA_3H2OxLRT',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn'),n=document.getElementById('notice');b.disabled=true;try{if(!client)throw Error('Bibliothèque Supabase indisponible');const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;location.href='inscription.html'}catch(err){n.textContent='Connexion impossible : '+err.message}finally{b.disabled=false}});</script></body></html>
