<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi de candidature | ODIT Lab Academy</title><style>:root{font-family:Inter,system-ui;color:#eafff5;background:#061c17}body{margin:0;background:radial-gradient(circle at 80% 10%,#115c45,#061c17 55%);min-height:100vh}main{max-width:650px;margin:9vh auto;padding:25px}.card{border:1px solid #ffffff33;background:#ffffff0a;border-radius:20px;padding:30px}p{color:#b9d6c9;line-height:1.65}a{color:#6eebb0}button{background:#42db94;color:#053322;border:0;border-radius:9px;padding:12px 18px;cursor:pointer;font-weight:800}</style></head><body><main><a href="../">← Site ODIT</a><div class="card"><h1>Ma candidature ODIT</h1><p id="message">Vérification de votre compte…</p><p id="details"></p><button id="logout">Se déconnecter</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>'use strict';const client=window.supabase?.createClient('https://rniaixhxbfiznhrnxvvn.supabase.co','sb_publishable_bS_yjMA0eCPk2SF5IQHTZA_3H2OxLRT',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});async function load(){const m=document.getElementById('message'),d=document.getElementById('details');if(!client){m.textContent='Connexion indisponible';return}const {data:{user}}=await client.auth.getUser();if(!user){location.href='connexion.html';return}const {data,error}=await client.from('lab_members').select('membership_status,approved_at,review_note').eq('user_id',user.id).maybeSingle();if(error){m.textContent='Impossible de lire votre statut : '+error.message;return}if(!data){m.textContent='Votre questionnaire est encore à compléter.';const a=document.createElement('a');a.href='inscription.html';a.textContent='Compléter ma candidature';d.append(a);return}const s=data.membership_status;m.textContent=({pending:'⏳ Candidature en attente de vérification',approved:'✅ Votre compte a été approuvé',rejected:'❌ Candidature refusée',suspended:'Compte temporairement suspendu'})[s]||'Statut : '+s;if(s==='approved')d.textContent='Votre accès est validé. Si un lab a déjà commencé, vous participerez au prochain lab. L’espace de réalisation sera disponible lors du déploiement de la prochaine étape.';else if(s==='pending')d.textContent='L’équipe ODIT vérifie vos réponses et votre appartenance au groupe WhatsApp.';else d.textContent=data.review_note||'Contactez l’équipe ODIT pour plus de précisions.'}document.getElementById('logout').onclick=async()=>{await client?.auth.signOut();location.href='connexion.html'};load();</script></body></html>
